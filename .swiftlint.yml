# Helm's lint. The house rules live in CLAUDE.md and ARCHITECTURE.md; this
# catches only what a machine can see, so it stays quiet enough to be read.
included:
  - Sources
  - Tests
excluded:
  - .build          # generated: SwiftPM's test runners and resource accessors
  - Scripts

disabled_rules:
  - todo            # a TODO in this repo is a decision recorded, not debt to nag about
  - trailing_comma  # trailing commas in multi-line literals are deliberate here

# A localized string is one line carrying eight languages; splitting it hurts
# more than it helps, and those lines are most of the file in the *Strings.swift
# files — a changelog entry runs past 2000 characters and is correct at that
# length. The warning is set where it still notices genuinely runaway code; an
# error threshold here would only report the design.
line_length:
  warning: 320
  error: 4000
  ignores_comments: false
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 700
  error: 1000
function_body_length:
  warning: 80
  error: 140
# A few names here are deliberate and cannot be renamed: the keys of a `Codable`
# struct that decodes GitHub's JSON must match the JSON (`browser_download_url`,
# `tag_name`), and `L(...)` / `Bytes(...)` read as the small DSL they are. So
# those three stay reported and are known: `severity` does not reach the
# name-format check, and renaming them would break the JSON or the DSL.
identifier_name:
  min_length: 2
  excluded: [id, x, y, w, h, r, p, s, c, d, n, a, b, to, up, ok, at, dx, dy]
