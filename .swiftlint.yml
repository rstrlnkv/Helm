# Helm's lint. The house rules live in CLAUDE.md and ARCHITECTURE.md; this
# catches only what a machine can see, so it stays quiet enough to be read.
included:
  - Sources
  - Tests
excluded:
  - .build          # generated: SwiftPM's test runners and resource accessors
  - Scripts

disabled_rules:
  - todo            # a TODO in this repo is a decision recorded, not debt to nag about
  - trailing_comma  # trailing commas in multi-line literals are deliberate here
  # `let _ = x` is not redundant inside a `ViewBuilder`, and this rule's autofix
  # does not know that. A builder takes declarations and drops them; rewritten to
  # a bare `_ = x` the line becomes an expression of type `()`, which the builder
  # then asks to conform to `View`. `swiftlint --fix` made exactly that edit in
  # `SettingsWindow.swift` on 2026-08-11 and the app stopped compiling — one line,
  # and `--fix` is the reason it was believed safe.
  - redundant_discardable_let
  # `statement_position`'s autofix joins both branches of an if/else onto one
  # line when each branch is already brace-on-the-same-line. It did that to five
  # `onGeometryChange` handlers, each sitting under a comment explaining why the
  # two branches differ, and produced lines of 129 to 139 characters. The rule is
  # right about `} else {`; its fix is not worth the five it damaged.
  - statement_position

# A localized string is one line carrying eight languages; splitting it hurts
# more than it helps, and those lines are most of the file in the *Strings.swift
# files — a changelog entry runs past 2000 characters and is correct at that
# length. The warning is set where it still notices genuinely runaway code; an
# error threshold here would only report the design.
line_length:
  warning: 320
  error: 4000
  ignores_comments: false
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 700
  error: 1000
function_body_length:
  warning: 80
  error: 140
# A few names here are deliberate and cannot be renamed, so they are excluded
# rather than left to nag every run into noise:
#   - the keys of a `Codable` struct that decodes GitHub's JSON must match the
#     wire (`browser_download_url`, `tag_name`, `html_url`, `installed_versions`,
#     `current_version`);
#   - the DSL functions `L`, `Bytes`, `Decimal`, `Count`, `Quoted` are
#     capitalized on purpose so they read as the types they format to at the
#     call site;
#   - `where_` is a reserved-word escape.
# Single letters are the house idiom for short-scope locals (loop indices and
# the like); the list carries the ones in use, not a blanket min-length drop —
# a two-letter name still has to say something.
identifier_name:
  min_length: 2
  excluded: [id, x, y, w, h, r, p, s, c, d, n, a, b, e, f, g, i, j, k, l, m, q, t, u, v, z, to, up, ok, at, dx, dy, L, Bytes, Decimal, Count, Quoted, browser_download_url, tag_name, html_url, installed_versions, current_version, where_]
